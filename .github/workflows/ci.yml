# Checks every push and pull request. Deploys are separate (Cloudflare Workers
# Builds deploys main on its own); this only reports whether the game still works.
name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Rules, rooms, AI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/engine.test.js
      - run: node tests/room.test.js
      - run: node tests/qrcode.test.js
      - run: node tests/worker.test.mjs
      - run: node tests/simulate.js 300
      - run: node tests/levels.js 2000

  browser:
    name: Browser (desktop + phone, solo + online)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test tools
        working-directory: tests/e2e
        # The runner image already has Chrome's system libraries, so only the
        # browser itself is downloaded (no apt mirrors involved). If even that
        # fails, fall back to the runner's own Google Chrome.
        run: |
          npm ci
          if ! npx playwright-core install chromium; then
            echo "CHROMIUM_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          fi
      - name: Start the game locally (Worker + Durable Objects)
        timeout-minutes: 5
        # The log goes OUTSIDE the project: wrangler dev reloads (dropping every
        # socket) whenever a project file changes. No stdin, so it can never
        # sit waiting on a prompt; each health check gives up after 5 seconds.
        run: |
          npx --yes wrangler@4.158.0 dev --port 8787 --ip 127.0.0.1 < /dev/null > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --max-time 5 http://127.0.0.1:8787/api/health && exit 0
            sleep 2
          done
          echo "Server didn't start:"; tail -50 "$RUNNER_TEMP/wrangler.log"; exit 1
      - name: Run browser tests
        working-directory: tests/e2e
        env:
          E2E_ORIGIN: http://127.0.0.1:8787
          E2E_OUT: ${{ runner.temp }}/gmdk-e2e
        run: node run-all.js
      - name: Screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            ${{ runner.temp }}/gmdk-e2e
            ${{ runner.temp }}/wrangler.log
          if-no-files-found: ignore
