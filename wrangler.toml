# Bid Whist — ONE Cloudflare Worker serves the game site AND runs online play.
#
# Cloudflare auto-deploys this on every push to `main` (Workers Builds is
# connected to the GitHub repo), so there is nothing to run by hand. Manual
# deploy, if ever needed:  npx wrangler login && npx wrangler deploy
#
# Runs on the Workers FREE plan: SQLite-backed Durable Objects are free-tier
# eligible. `name` must match the Worker connected in the Cloudflare dashboard.

name = "bidwhist"
main = "server/worker.js"
compatibility_date = "2025-10-01"

# Custom domains (bought via Cloudflare Registrar, so the zone is on this
# account). On deploy, Cloudflare creates the DNS records and HTTPS
# certificates for these automatically. The site and the game server share the
# origin, so whichever address a player opens is also the server.
routes = [
  { pattern = "givemedakitty.com", custom_domain = true },
  { pattern = "www.givemedakitty.com", custom_domain = true },
]
# Keep bidwhist.<subdomain>.workers.dev live too, so links and QR codes that
# were already shared keep working.
workers_dev = true

# The static game (index.html, styles.css, js/, _headers) is served straight
# from the repo root; .assetsignore keeps server code, tests and docs out.
# Requests that don't match a file (i.e. /api/*) fall through to the Worker.
# The page and service worker go through the Worker first, which stamps them
# with this deploy's version (the ?v= cache-busting tags) — nothing to bump by hand.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/sw.js"]

# This deploy's version id, used for that stamp.
[version_metadata]
binding = "VERSION"

# One Durable Object class = one authoritative game room per game key.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# The Daily Deal leaderboard: one Durable Object per day.
[[durable_objects.bindings]]
name = "DAILY_BOARD"
class_name = "DailyBoard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DailyBoard"]
